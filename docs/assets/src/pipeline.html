<!doctype html>

<title>paper-survey-kit pipeline</title>
<style>

</style>

    <rect x="825" y="230" width="160" height="78" rx="10" fill="#fff" stroke="var(--a)"/>

    <rect x="1005" y="230" width="160" height="78" rx="10" fill="#fff" stroke="var(--a)"/>

    <path d="M805 269 L821 269" stroke="var(--a)" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M985 269 L1001 269" stroke="var(--a)" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <text x="645" y="408" class="s">判定詞校準：provisional · leaning · hypothetical · withhold</text>

    <text x="725" y="578" text-anchor="middle" class="s">每項都要「為什麼」</text>
    <rect x="825" y="520" width="160" height="78" rx="10" fill="#fff" stroke="var(--b)"/>
    <text x="905" y="552" text-anchor="middle" class="t" style="font-size:19px">故事線＋偏移</text>
    <text x="905" y="578" text-anchor="middle" class="s">十種說過頭的徵兆</text>
    <rect x="1005" y="520" width="160" height="78" rx="10" fill="#fff" stroke="var(--b)"/>

    <path d="M985 559 L1001 559" stroke="var(--b)" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <text x="645" y="674" class="s">每條偏移附原文引句，腳本逐字比對 paper.txt</text>
  <text x="645" y="698" class="s">key point = 口號＋綁定＋每一環的依據（warrant）</text>
  <path d="M905 420 L905 456" stroke="#5b6470" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/>

  <rect x="1230" y="370" width="150" height="130" rx="12" fill="var(--g-bg)" stroke="var(--g)" stroke-width="1.5"/>

  <text x="1495" y="328" text-anchor="middle" class="s">練習・複習用</text>
  <text x="1495" y="352" text-anchor="middle" class="m">paper-explainer</text>
  <text x="1495" y="372" text-anchor="middle" class="m">.html</text>
  <rect x="1420" y="470" width="150" height="150" rx="12" fill="#fff" stroke="#8b95a1"/>
  <text x="1495" y="520" text-anchor="middle" class="t" style="font-size:20px">正式簡報</text>
  <text x="1495" y="548" text-anchor="middle" class="s">英文投影片</text>
  <text x="1495" y="572" text-anchor="middle" class="m">空白底 4:3</text>
  <text x="1495" y="592" text-anchor="middle" class="m">.pptx</text>
  <path d="M1380 415 C1400 415 1400 325 1416 325" stroke="#5b6470" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M1380 455 C1400 455 1400 545 1416 545" stroke="#5b6470" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="1495" y="650" text-anchor="middle" class="s">只在明確要求時做</text>

  <text x="60" y="790" class="s">兩種產物不互轉：說明頁給自己讀，正式簡報給聽眾看。圖中名詞對應 SKILL.md 的節點 N0–N6。</text>
